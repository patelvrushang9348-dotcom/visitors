<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visitor Profile Management</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--card:#14233e;--blue:#2563eb;--gold:#fbbf24;--muted:#a8b7ce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}.wrap{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:white;font-weight:700;cursor:pointer;text-decoration:none}.btn.gold{background:var(--gold);color:#111827}.card{background:var(--card);border:1px solid #2b4267;border-radius:16px;padding:20px;margin-bottom:18px}input{width:100%;padding:12px;border-radius:10px;border:1px solid #47658c;background:#0d1a2f;color:white;margin:6px 0 12px}label{display:block;color:#dbeafe;font-size:14px;font-weight:700}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #334765}th{color:#fbbf24}td small{color:var(--muted)}.table-wrap{overflow:auto}.actions{display:flex;gap:8px}.danger{background:#b91c1c}.muted{color:var(--muted)}#status{margin:10px 0;color:#fde68a}
</style></head><body><div class="wrap">
<div class="top"><div><h1>👥 Visitor Profile Management</h1><p class="muted">Create, edit, and remove visitor profiles. One common QR is used at the entrance.</p></div><div><a class="btn gold" href="/admin">← Admin Dashboard</a> <a class="btn" href="/qr">Common QR</a></div></div>
<div class="card"><h2>Add / Register Visitor Profile</h2><form id="create-form"><label for="name">Visitor full name</label><input id="name" required minlength="2" maxlength="100" placeholder="e.g. Rahul Patel"><label for="phone">Mobile number (10 digits)</label><input id="phone" required inputmode="numeric" maxlength="10" pattern="[0-9]{10}" placeholder="9876543210"><button class="btn gold" type="submit">Register Profile</button></form><div id="status"></div></div>
<div class="card"><h2>Registered Profiles</h2><button class="btn" onclick="loadProfiles()">Refresh</button><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Name</th><th>Mobile</th><th>Saved photos</th><th>Registered / last visit</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div></div>
</div><script>
const statusEl=document.getElementById('status');
async function loadProfiles(){const rows=document.getElementById('rows');rows.innerHTML='<tr><td colspan="5">Loading…</td></tr>';try{const r=await fetch('/api/admin/profiles');const d=await r.json();if(!d.success)throw Error(d.message||'Failed');if(!d.profiles.length){rows.innerHTML='<tr><td colspan="5">No visitor profiles registered yet.</td></tr>';return;}rows.innerHTML='';d.profiles.forEach(p=>{const tr=document.createElement('tr');const name=document.createElement('td');name.textContent=p.name;const phone=document.createElement('td');phone.textContent=p.phone;const count=document.createElement('td');count.textContent=p.photoCount;const date=document.createElement('td');date.textContent=p.registeredAt?new Date(p.registeredAt).toLocaleString():'—';const actions=document.createElement('td');actions.className='actions';const edit=document.createElement('button');edit.className='btn';edit.textContent='Edit';edit.onclick=()=>editProfile(p);const del=document.createElement('button');del.className='btn danger';del.textContent='Delete';del.onclick=()=>deleteProfile(p);actions.append(edit,del);tr.append(name,phone,count,date,actions);rows.appendChild(tr);});}catch(e){rows.innerHTML='<tr><td colspan="5">Could not load profiles. Is the server running?</td></tr>';}}
async function editProfile(p){const name=prompt('Update visitor name:',p.name);if(name===null)return;if(name.trim().length<2)return alert('Name must be at least 2 characters.');try{const r=await fetch('/api/admin/profiles/'+encodeURIComponent(p.phone),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim()})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Update failed');statusEl.textContent=d.message;loadProfiles();}catch(e){alert(e.message);}}
async function deleteProfile(p){if(!confirm(`Delete profile for ${p.name} (${p.phone})? This also removes their stored profile references and QR tokens.`))return;try{const r=await fetch('/api/admin/profiles/'+encodeURIComponent(p.phone),{method:'DELETE'});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Delete failed');statusEl.textContent=d.message;loadProfiles();}catch(e){alert(e.message);}}
document.getElementById('create-form').addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();try{const r=await fetch('/api/visitor/register-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Registration failed');statusEl.textContent='Visitor profile registered successfully.';e.target.reset();loadProfiles();}catch(err){statusEl.textContent=err.message;}});
loadProfiles();
</script></body></html>
